baseURL = "https://mzr6.com/"
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
title = "马走日的博客"
theme = "LoveIt"

enableEmoji = true
enableRobotsTXT = true

[pagination]
  pagerSize = 10
  path = "page"

[menu]
  [[menu.main]]
    weight = 1
    identifier = "posts"
    name = "所有文章"
    url = "posts/"
  [[menu.main]]
    weight = 2
    identifier = "tags"
    name = "标签"
    url = "tags/"
  [[menu.main]]
    weight = 3
    identifier = "categories"
    name = "分类"
    url = "categories/"
  [[menu.main]]
    weight = 4
    identifier = "about"
    name = "关于"
    url = "about/"

[params]
  defaultTheme = "auto"

[params.home.profile]
  enable = true
  avatarURL = "/images/tx01.jpg"
  title = "马走日"
  subtitle = "记录工程手记与自建服务"
  typeit = true

[params.header]
  desktopMode = "fixed"
  mobileMode = "auto"
  [params.header.title]
    name = "马走日博客"

[params.search]
  enable = true
  type = "fuse"
  contentLength = 4000
  placeholder = ""
  maxResultLength = 10
  snippetLength = 30
  highlightTag = "em"
  absoluteURL = false
  [params.search.fuse]
    isCaseSensitive = false
    minMatchCharLength = 2
    findAllMatches = false
    location = 0
    threshold = 0.3
    distance = 100
    ignoreLocation = false

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params.page.toc]
  enable = true
  keepStatic = false

[markup.highlight]
  noClasses = false
  